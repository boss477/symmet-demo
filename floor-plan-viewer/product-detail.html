<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product - Symmet Shop</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8f8f6;
      color: #1a1a1a;
    }

    header {
      background: white;
      padding: 24px 40px;
      border-bottom: 1px solid #e8e8e6;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 28px;
      font-weight: 700;
    }

    nav a {
      color: #1a1a1a;
      text-decoration: none;
      margin: 0 16px;
      font-weight: 500;
    }

    nav a:hover { color: #4a6fa5; }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px;
    }

    .breadcrumb {
      margin-bottom: 32px;
      font-size: 14px;
      color: #888;
    }

    .breadcrumb a {
      color: #4a6fa5;
      text-decoration: none;
      font-weight: 500;
    }

    .breadcrumb a:hover {
      text-decoration: underline;
    }

    .product-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
      margin-bottom: 64px;
    }

    .product-image-container {
      background: white;
      border-radius: 8px;
      border: 1px solid #e8e8e6;
      padding: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1;
    }

    .product-image-container img {
      max-width: 100%;
      max-height: 100%;
    }

    .product-image-placeholder {
      font-size: 120px;
      color: #ccc;
    }

    .product-info-container {
      display: flex;
      flex-direction: column;
    }

    .product-code {
      font-size: 12px;
      color: #888;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .product-name {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 16px;
      line-height: 1.2;
    }

    .product-price {
      font-size: 28px;
      font-weight: 700;
      color: #4a6fa5;
      margin-bottom: 24px;
    }

    .product-description {
      font-size: 16px;
      line-height: 1.6;
      color: #666;
      margin-bottom: 32px;
      padding-bottom: 32px;
      border-bottom: 1px solid #e8e8e6;
    }

    .quantity-selector {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .quantity-label {
      font-size: 14px;
      font-weight: 500;
      color: #1a1a1a;
      min-width: 80px;
    }

    .quantity-input {
      display: flex;
      align-items: center;
      border: 1px solid #e8e8e6;
      border-radius: 4px;
      gap: 12px;
      padding: 8px 12px;
    }

    .quantity-input button {
      background: none;
      border: none;
      font-size: 16px;
      cursor: pointer;
      color: #888;
      padding: 4px 8px;
    }

    .quantity-input button:hover {
      color: #4a6fa5;
    }

    .quantity-input input {
      width: 50px;
      border: none;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
    }

    .add-to-cart-btn {
      width: 100%;
      padding: 16px 24px;
      background: #4a6fa5;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
      transition: all 0.2s;
    }

    .add-to-cart-btn:hover {
      background: #3a5a95;
    }

    .try-studio-btn {
      width: 100%;
      padding: 16px 24px;
      background: white;
      color: #4a6fa5;
      border: 1px solid #4a6fa5;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .try-studio-btn:hover {
      background: #f8f8f6;
    }

    .collapsible-section {
      margin-top: 32px;
      border-top: 1px solid #e8e8e6;
      padding-top: 32px;
    }

    .collapsible-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      padding: 16px;
      background: white;
      border-radius: 8px;
      border: 1px solid #e8e8e6;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.2s;
      user-select: none;
    }

    .collapsible-header:hover {
      background: #f8f8f6;
      border-color: #4a6fa5;
    }

    .collapsible-header.open {
      background: #f8f8f6;
      border-color: #4a6fa5;
    }

    .collapsible-toggle {
      font-size: 20px;
      transition: transform 0.2s;
    }

    .collapsible-header.open .collapsible-toggle {
      transform: rotate(180deg);
    }

    .collapsible-content {
      display: none;
      padding: 24px 16px;
      background: white;
      border-left: 1px solid #e8e8e6;
      border-right: 1px solid #e8e8e6;
      border-bottom: 1px solid #e8e8e6;
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
    }

    .collapsible-content.open {
      display: block;
    }

    .collapsible-content p {
      font-size: 14px;
      line-height: 1.6;
      color: #666;
    }

    .warranty-badge {
      display: inline-block;
      background: #4a6fa5;
      color: white;
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      font-size: 16px;
      color: #888;
    }

    @media (max-width: 768px) {
      .product-layout {
        grid-template-columns: 1fr;
        gap: 32px;
      }

      .product-name {
        font-size: 24px;
      }

      .product-price {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Symmet Shop</h1>
    <nav>
      <a href="shop.html">Shop</a>
      <a href="checkout.html">Checkout</a>
    </nav>
  </header>

  <div class="container">
    <div class="breadcrumb">
      <a href="shop.html">Shop</a> / <span id="breadcrumbName">Product</span>
    </div>

    <div id="productContent" class="loading">Loading product...</div>
  </div>

  <script>
    const API = 'https://symmet.in';
    const urlParams = new URLSearchParams(window.location.search);
    const productCode = urlParams.get('code');

    if (!productCode) {
      document.getElementById('productContent').innerHTML = '<div class="loading">Product not found. Please select a product.</div>';
    } else {
      loadProduct();
    }

    async function loadProduct() {
      try {
        const res = await fetch(`${API}/api/products/${encodeURIComponent(productCode)}`);
        const product = await res.json();

        document.getElementById('breadcrumbName').textContent = product.product_code;
        document.title = `${product.product_code} - Symmet Shop`;
        displayProduct(product);
      } catch (e) {
        console.error('Failed to load product:', e);
        document.getElementById('productContent').innerHTML = '<div class="loading">Failed to load product</div>';
      }
    }

    function displayProduct(product) {
      const firstVariant = product.variants?.[0];
      const minPrice = firstVariant?.display_price || 0;
      const description = firstVariant?.description || product.description || '';

      const warrantyBadgeLabel = {
        'metal': '5 Years Warranty',
        'wood': '2 Years Warranty',
        'unknown': '1 Year Warranty'
      }[product.warranty_base_type] || 'Standard Warranty';

      document.getElementById('productContent').innerHTML = `
        <div class="product-layout">
          <div class="product-image-container">
            ${product.image_url
              ? `<img src="${product.image_url}" alt="${product.product_code}" onerror="this.style.display='none'">`
              : ''}
            <div class="product-image-placeholder" ${product.image_url ? 'style="display:none"' : ''}>🪑</div>
          </div>

          <div class="product-info-container">
            <div class="product-code">${product.category}</div>
            <h1 class="product-name">${product.product_code}</h1>
            <div class="product-price">₹${minPrice.toLocaleString('en-IN')}</div>

            <p class="product-description">${description}</p>

            <div class="quantity-selector">
              <label class="quantity-label">Quantity:</label>
              <div class="quantity-input">
                <button onclick="decreaseQty()">−</button>
                <input type="number" id="quantity" value="1" min="1" readonly>
                <button onclick="increaseQty()">+</button>
              </div>
            </div>

            <button class="add-to-cart-btn" onclick="addToCart('${product.product_code}')">Add to Cart</button>
            <button class="try-studio-btn" onclick="alert('Try in Studio feature coming soon')">Try in Studio</button>

            <!-- Dimensions Section -->
            <div class="collapsible-section">
              <div class="collapsible-header" onclick="toggleSection(this)">
                <span>Dimensions</span>
                <span class="collapsible-toggle">▼</span>
              </div>
              <div class="collapsible-content">
                ${product.variants.map(v => `
                  <p><strong>${v.seater || 'Variant'}</strong><br>${v.size}</p>
                `).join('')}
              </div>
            </div>

            <!-- Materials Section -->
            <div class="collapsible-section">
              <div class="collapsible-header" onclick="toggleSection(this)">
                <span>Materials</span>
                <span class="collapsible-toggle">▼</span>
              </div>
              <div class="collapsible-content">
                <p>Premium materials crafted for durability and comfort. Details available upon request.</p>
              </div>
            </div>

            <!-- Warranty Section -->
            <div class="collapsible-section">
              <div class="collapsible-header" onclick="toggleSection(this)">
                <span>Warranty</span>
                <span class="collapsible-toggle">▼</span>
              </div>
              <div class="collapsible-content">
                <div class="warranty-badge">${warrantyBadgeLabel}</div>
                <p>${product.warranty_text || 'No warranty information available.'}</p>
              </div>
            </div>

            <!-- Delivery Section -->
            <div class="collapsible-section">
              <div class="collapsible-header" onclick="toggleSection(this)">
                <span>Delivery</span>
                <span class="collapsible-toggle">▼</span>
              </div>
              <div class="collapsible-content">
                <p>Free shipping on orders over ₹50,000. Standard delivery takes 5-7 business days. Expedited options available.</p>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function toggleSection(header) {
      header.classList.toggle('open');
      header.nextElementSibling.classList.toggle('open');
    }

    function increaseQty() {
      const input = document.getElementById('quantity');
      input.value = parseInt(input.value) + 1;
    }

    function decreaseQty() {
      const input = document.getElementById('quantity');
      if (parseInt(input.value) > 1) {
        input.value = parseInt(input.value) - 1;
      }
    }

    function addToCart(productCode) {
      const quantity = parseInt(document.getElementById('quantity').value);
      let cart = JSON.parse(localStorage.getItem('symmet-cart') || '[]');

      for (let i = 0; i < quantity; i++) {
        cart.push(productCode);
      }

      localStorage.setItem('symmet-cart', JSON.stringify(cart));
      alert(`Added ${quantity} item(s) to cart`);
    }
  </script>
</body>
</html>
