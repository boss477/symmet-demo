<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Design Gallery</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f5f5; }
    header { background: #1a1a2e; color: #fff; padding: 1rem 1.5rem; }
    header h1 { margin: 0; font-size: 1.4rem; font-weight: 600; }
    #gallery-root { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.25rem; padding: 1.5rem; }
    .card { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.1); text-decoration: none; color: inherit; display: flex; flex-direction: column; transition: box-shadow .15s; }
    .card:hover { box-shadow: 0 4px 14px rgba(0,0,0,.15); }
    .card__cover { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #ddd; }
    .card__cover--placeholder { width: 100%; aspect-ratio: 16/9; background: linear-gradient(135deg, #e0e0e0 0%, #c8c8c8 100%); display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 2rem; }
    .card__body { padding: .75rem 1rem; }
    .card__title { font-size: 1rem; font-weight: 600; margin: 0 0 .25rem; }
    .card__date { font-size: .78rem; color: #999; }
    .empty { padding: 3rem; text-align: center; color: #999; }
    .error { padding: 3rem; text-align: center; color: #c00; }
  </style>
</head>
<body>
  <header><h1>Design Gallery</h1></header>
  <div id="gallery-root"></div>
  <script type="module" src="/src/gallery/main.js"></script>
</body>
</html>
