<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-label="2D floor plan redraw of two bedrooms, two toilets, and a passage">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#9c876d" flood-opacity="0.16"/>
    </filter>
    <style>
      .wall { fill: none; stroke: #5cbf8a; stroke-width: 18; stroke-linecap: square; stroke-linejoin: miter; }
      .inner-wall { fill: none; stroke: #5cbf8a; stroke-width: 14; stroke-linecap: square; stroke-linejoin: miter; }
      .room-fill { stroke: none; }
      .label { font-family: Arial, Helvetica, sans-serif; fill: #2d2a26; text-anchor: middle; }
      .label-room { font-size: 28px; font-weight: 700; letter-spacing: 1px; }
      .label-size { font-size: 18px; font-weight: 600; }
      .fixture { fill: #f7f5ef; stroke: #b6a78e; stroke-width: 3; }
      .fixture-dark { fill: #c99a6a; stroke: #a47649; stroke-width: 3; }
      .door-arc { fill: none; stroke: #c98a4d; stroke-width: 5; stroke-linecap: round; }
      .door-leaf { fill: none; stroke: #805331; stroke-width: 5; stroke-linecap: round; }
      .passage { fill: #f7ecd8; }
      .corner { fill: #5cbf8a; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="700" fill="#f4f2ed"/>

  <g filter="url(#softShadow)">
    <rect x="110" y="95" width="805" height="470" rx="4" class="wall"/>

    <rect x="118" y="103" width="395" height="140" class="room-fill" fill="#f3ead7"/>
    <rect x="118" y="243" width="395" height="314" class="room-fill" fill="#f1dfcf"/>
    <rect x="513" y="103" width="394" height="318" class="room-fill" fill="#f5eedf"/>
    <rect x="702" y="421" width="205" height="136" class="room-fill" fill="#f1dccb"/>
    <rect x="513" y="421" width="189" height="136" class="passage"/>

    <rect x="110" y="95" width="805" height="470" rx="4" class="wall"/>

    <path class="inner-wall" d="M 513 103 L 513 421"/>
    <path class="inner-wall" d="M 118 243 L 513 243"/>
    <path class="inner-wall" d="M 513 421 L 702 421"/>
    <path class="inner-wall" d="M 702 421 L 702 557"/>

    <path class="inner-wall" d="M 118 103 L 513 103"/>
    <path class="inner-wall" d="M 513 103 L 907 103"/>

    <path class="inner-wall" d="M 118 557 L 513 557"/>
    <path class="inner-wall" d="M 702 557 L 907 557"/>

    <path class="inner-wall" d="M 513 421 L 513 557"/>

    <path class="inner-wall" d="M 118 243 L 118 557"/>

    <path class="door-arc" d="M 452 243 A 46 46 0 0 1 498 197"/>
    <path class="door-leaf" d="M 452 243 L 498 243"/>

    <path class="door-arc" d="M 513 515 A 56 56 0 0 1 569 459"/>
    <path class="door-leaf" d="M 513 515 L 569 515"/>

    <path class="door-arc" d="M 702 515 A 52 52 0 0 1 650 463"/>
    <path class="door-leaf" d="M 702 515 L 650 515"/>

    <path class="door-arc" d="M 702 421 A 52 52 0 0 1 754 369"/>
    <path class="door-leaf" d="M 702 421 L 754 421"/>

    <rect x="143" y="323" width="118" height="168" rx="8" class="fixture"/>
    <rect x="136" y="333" width="42" height="92" rx="6" class="fixture-dark"/>
    <rect x="770" y="185" width="104" height="118" rx="8" class="fixture"/>
    <rect x="762" y="193" width="34" height="78" rx="6" class="fixture-dark"/>
    <rect x="761" y="461" width="92" height="74" rx="8" class="fixture"/>
    <circle cx="851" cy="498" r="14" class="fixture"/>
    <rect x="132" y="130" width="96" height="46" rx="6" class="fixture"/>

    <rect x="182" y="365" width="120" height="138" rx="4" fill="#ffffff" stroke="#e0d3c4" stroke-width="3"/>
    <rect x="170" y="378" width="26" height="120" rx="4" fill="#dfb48c"/>

    <rect x="682" y="176" width="136" height="120" rx="4" fill="#ffffff" stroke="#e0d3c4" stroke-width="3"/>
    <rect x="818" y="190" width="28" height="102" rx="4" fill="#dfb48c"/>

    <text x="318" y="160" class="label label-room">TOILET</text>
    <text x="318" y="186" class="label label-size">11'-5" x 5'-0"</text>

    <text x="314" y="390" class="label label-room">BEDROOM</text>
    <text x="314" y="416" class="label label-size">11'-5" x 13'-1"</text>

    <text x="717" y="250" class="label label-room">BEDROOM</text>
    <text x="717" y="276" class="label label-size">11'-4" x 14'-0"</text>

    <text x="806" y="505" class="label label-room">TOILET</text>
    <text x="806" y="531" class="label label-size">7'-1" x 4'-0"</text>

    <g opacity="0.95">
      <circle cx="510" cy="560" r="7" class="corner"/>
      <circle cx="702" cy="421" r="7" class="corner"/>
      <circle cx="513" cy="243" r="7" class="corner"/>
      <circle cx="702" cy="557" r="7" class="corner"/>
    </g>
  </g>
</svg>