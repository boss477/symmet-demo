<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout - Symmet Shop</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8f8f6;
      color: #1a1a1a;
    }
    header {
      background: white;
      padding: 24px 40px;
      border-bottom: 1px solid #e8e8e6;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-size: 28px;
      font-weight: 700;
    }
    nav a {
      color: #1a1a1a;
      text-decoration: none;
      margin: 0 16px;
      font-weight: 500;
    }
    nav a:hover { color: #4a6fa5; }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px;
    }
    .form-group {
      margin-bottom: 24px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d0d0cc;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    button {
      background: #4a6fa5;
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background: #3a5a95;
    }
    .cart-summary {
      background: white;
      padding: 24px;
      border-radius: 8px;
      border: 1px solid #e8e8e6;
      margin-top: 32px;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #e8e8e6;
    }
    .cart-item:last-child {
      border-bottom: none;
    }
    .total {
      display: flex;
      justify-content: space-between;
      padding: 16px 0;
      font-size: 18px;
      font-weight: 700;
    }
    .success-msg {
      background: #e8f5e9;
      border: 1px solid #4caf50;
      color: #2e7d32;
      padding: 16px;
      border-radius: 4px;
      margin-bottom: 24px;
      display: none;
    }
    .empty-cart {
      text-align: center;
      padding: 40px;
      color: #888;
    }
  </style>
</head>
<body>
  <header>
    <h1>Checkout</h1>
    <nav>
      <a href="shop.html">Back to Shop</a>
    </nav>
  </header>

  <div class="container">
    <div class="success-msg" id="successMsg"></div>

    <div id="emptyCart" class="empty-cart">
      <p style="margin-bottom: 16px;">Your cart is empty</p>
      <a href="shop.html" style="color: #4a6fa5; text-decoration: none; font-weight: 600;">Continue shopping →</a>
    </div>

    <form id="checkoutForm" style="display: none;">
      <h2 style="margin-bottom: 24px;">Delivery Information</h2>

      <div class="form-row">
        <div class="form-group">
          <label>First Name *</label>
          <input type="text" name="firstName" required>
        </div>
        <div class="form-group">
          <label>Last Name *</label>
          <input type="text" name="lastName" required>
        </div>
      </div>

      <div class="form-group">
        <label>Email *</label>
        <input type="email" name="email" required>
      </div>

      <div class="form-group">
        <label>Address *</label>
        <input type="text" name="address" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>City *</label>
          <input type="text" name="city" required>
        </div>
        <div class="form-group">
          <label>Postcode *</label>
          <input type="text" name="postcode" required>
        </div>
      </div>

      <div class="cart-summary">
        <h3 style="margin-bottom: 16px;">Order Summary</h3>
        <div id="cartItems"></div>
        <div class="total">
          <span>Total:</span>
          <span id="totalPrice">$0</span>
        </div>
        <button type="submit" style="width: 100%; margin-top: 24px;">Place Order</button>
      </div>
    </form>
  </div>

  <script>
    const API = 'https://symmet-shop-api.iidaworkzz.workers.dev';

    async function loadCart() {
      const cart = JSON.parse(localStorage.getItem('symmet-cart') || '[]');
      if (!cart.length) {
        document.getElementById('emptyCart').style.display = 'block';
        return;
      }

      document.getElementById('checkoutForm').style.display = 'block';
      document.getElementById('emptyCart').style.display = 'none';

      try {
        // Fetch product details for cart items
        const products = await Promise.all(
          cart.map(code => fetch(`${API}/api/products/${encodeURIComponent(code)}`).then(r => r.json()))
        );

        let total = 0;
        const itemsHtml = products.map((p, i) => {
          const price = p.variants?.[0]?.display_price || p.min_price || 0;
          total += price;
          return `
            <div class="cart-item">
              <span>${p.product_code}</span>
              <span>$${price.toLocaleString()}</span>
            </div>
          `;
        }).join('');

        document.getElementById('cartItems').innerHTML = itemsHtml;
        document.getElementById('totalPrice').textContent = `$${total.toLocaleString()}`;

        // Store for submission
        window.cartTotal = total;
        window.cartItems = cart.map((code, i) => ({ code, price: products[i]?.min_price || 0 }));
      } catch (e) {
        console.error('Failed to load cart:', e);
      }
    }

    document.getElementById('checkoutForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(e.target);
      const order = {
        firstName: formData.get('firstName'),
        lastName: formData.get('lastName'),
        email: formData.get('email'),
        address: formData.get('address'),
        city: formData.get('city'),
        postcode: formData.get('postcode'),
        items: window.cartItems,
        total: window.cartTotal
      };

      try {
        const res = await fetch(`${API}/api/checkout`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(order)
        });
        const data = await res.json();
        if (data.orderNo) {
          document.getElementById('successMsg').textContent = `Order placed! Order #${data.orderNo}`;
          document.getElementById('successMsg').style.display = 'block';
          localStorage.removeItem('symmet-cart');
          e.target.style.display = 'none';
          setTimeout(() => {
            window.location.href = 'shop.html';
          }, 2000);
        } else {
          alert('Error: ' + (data.error || 'Unknown error'));
        }
      } catch (e) {
        alert('Failed to place order: ' + e.message);
      }
    });

    loadCart();
  </script>
</body>
</html>
